    <main class="main-container">
        <section class="hero"><h1>Calculadora de Días Entre Fechas</h1><p>Calcula exactamente cuántos días hay entre dos fechas cualesquiera.</p></section>
        <section class="calculator-card">
            <div class="calculator-grid">
                <div class="input-column">
                    <div class="input-group"><label>Fecha de Inicio</label><input type="date" id="start-date" value="2026-01-01"></div>
                    <div class="input-group"><label>Fecha de Fin</label><input type="date" id="end-date" value="2026-12-31"></div>
                    <button class="calculate-btn" onclick="calcularDias()">Calcular Días</button>
                </div>
                <div class="result-display">
                    <div class="big-number" id="days-result">—</div>
                    <div class="big-label">días</div>
                    <div class="result-details">
                        <div class="result-mini"><div class="mini-value" id="weeks-result">—</div><div class="mini-label">Semanas</div></div>
                        <div class="result-mini"><div class="mini-value" id="months-result">—</div><div class="mini-label">Meses (aprox.)</div></div>
                    </div>
                    <div class="ad-placeholder">Anuncio AdSense</div>
                </div>
            </div>

    <script>
        document.getElementById('end-date').valueAsDate=new Date();
        document.getElementById('start-date').valueAsDate=new Date(new Date().setMonth(new Date().getMonth()-1));
        function calcularDias(){const s=new Date(document.getElementById('start-date').value),e=new Date(document.getElementById('end-date').value);if(isNaN(s.getTime())||isNaN(e.getTime()))return;const d=Math.max(0,Math.round((e-s)/86400000));document.getElementById('days-result').textContent=d.toLocaleString();document.getElementById('weeks-result').textContent=(d/7).toFixed(1);document.getElementById('months-result').textContent=(d/30.44).toFixed(1)}
        calcularDias();
    </script>
