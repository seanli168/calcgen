    <script>
        function actualizarColor(h){document.getElementById('color-preview').style.background=h;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);document.getElementById('hex-value').value=h.toUpperCase();document.getElementById('rgb-value').value='rgb('+r+', '+g+', '+b+')';const hsl=rgbToHsl(r,g,b);document.getElementById('hsl-value').value='hsl('+hsl[0]+', '+hsl[1]+'%, '+hsl[2]+'%)'}
        function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h=0,s=0,l=(M+m)/2;if(M!==m){const d=M-m;s=l>0.5?d/(2-M-m):d/(M+m);switch(M){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)]}
        function copiar(id){navigator.clipboard.writeText(document.getElementById(id).value)}
    </script>
