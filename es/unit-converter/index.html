    <header class="header"><div class="header-inner"><a href="/es/" class="logo">CalcGen</a><nav class="nav"><a href="/es/">Inicio</a><a href="/es/calculators/">Calculadoras</a><a href="/es/blog/">Blog</a><div class="lang-switch"><a href="/unit-converter/">EN</a><a href="/es/unit-converter/" class="active">ES</a></div></nav></div></header>
    <div class="breadcrumb"><a href="/es/">Inicio</a> &rsaquo; <a href="/es/calculators/">Calculadoras</a> &rsaquo; <strong>Conversor de Unidades</strong></div>
    <main class="main-container">
        <section class="hero"><h1>Conversor de Unidades</h1><p>Convierte entre unidades métricas e imperiales. Longitud, peso y temperatura.</p></section>
        <section class="calculator-card">
            <div class="category-tabs" id="cat-tabs">
                <button class="cat-tab active" data-cat="length">📏 Longitud</button>
                <button class="cat-tab" data-cat="weight">⚖️ Peso</button>
                <button class="cat-tab" data-cat="temperature">🌡️ Temperatura</button>
            </div>
            <div class="converter-grid">
                <div class="input-group"><label>De</label><input type="number" id="from-value" value="1" step="any" oninput="convertir()"><select id="from-unit"></select></div>
                <button class="swap-btn" onclick="intercambiar()">⇄</button>
                <div><label style="font-weight:600;font-size:14px;color:#374151;margin-bottom:6px;display:block">A</label><div class="result-value" id="to-value">—</div><select id="to-unit" style="width:100%;margin-top:6px" onchange="convertir()"></select></div>
            </div>
            <div class="ad-placeholder">Anuncio AdSense</div>
        </section>
    </main>
    <footer class="footer"><div class="footer-links"><a href="/es/privacy-policy/">Privacidad</a><a href="/es/terms/">Términos</a><a href="/es/contact/">Contacto</a></div><p>&copy; 2026 CalcGen</p></footer>
    <script>
        const unidades={length:[{n:'Metros (m)',f:1},{n:'Kilómetros (km)',f:1000},{n:'Centímetros (cm)',f:0.01},{n:'Millas (mi)',f:1609.34},{n:'Pies (ft)',f:0.3048},{n:'Pulgadas (in)',f:0.0254}],weight:[{n:'Kilogramos (kg)',f:1},{n:'Gramos (g)',f:0.001},{n:'Libras (lbs)',f:0.453592},{n:'Onzas (oz)',f:0.0283495}],temperature:null};
        let catActual='length';
        function poblar(cat){
            const fs=document.getElementById('from-unit'),ts=document.getElementById('to-unit');
            fs.innerHTML='';ts.innerHTML='';
            if(cat==='temperature'){['Celsius (°C)','Fahrenheit (°F)','Kelvin (K)'].forEach((u,i)=>{fs.innerHTML+='<option value="'+i+'">'+u+'</option>';ts.innerHTML+='<option value="'+i+'">'+u+'</option>'});ts.value=1}
            else{unidades[cat].forEach((u,i)=>{fs.innerHTML+='<option value="'+i+'">'+u.n+'</option>';ts.innerHTML+='<option value="'+i+'">'+u.n+'</option>'});ts.value=Math.min(3,unidades[cat].length-1)}
        }
        function convertir(){
            const v=parseFloat(document.getElementById('from-value').value)||0;let r;
            if(catActual==='temperature'){
                const fi=parseInt(document.getElementById('from-unit').value),ti=parseInt(document.getElementById('to-unit').value);let c;
                if(fi===0)c=v;else if(fi===1)c=(v-32)*5/9;else c=v-273.15;
                if(ti===0)r=c;else if(ti===1)r=c*9/5+32;else r=c+273.15;
            }else{const ff=unidades[catActual][parseInt(document.getElementById('from-unit').value)].f,tf=unidades[catActual][parseInt(document.getElementById('to-unit').value)].f;r=v*ff/tf}
            document.getElementById('to-value').textContent=parseFloat(r.toPrecision(6)).toString()
        }
        function intercambiar(){const fs=document.getElementById('from-unit'),ts=document.getElementById('to-unit');const t=fs.value;fs.value=ts.value;ts.value=t;convertir()}
        document.getElementById('cat-tabs').addEventListener('click',function(e){if(e.target.classList.contains('cat-tab')){document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');catActual=e.target.getAttribute('data-cat');poblar(catActual);convertir()}});
        poblar('length');convertir();
    </script>
