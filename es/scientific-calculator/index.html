    <header class="header"><div class="header-inner"><a href="/es/" class="logo">CalcGen</a><nav class="nav"><a href="/es/">Inicio</a><a href="/es/calculators/">Calculadoras</a><a href="/es/blog/">Blog</a><div class="lang-switch"><a href="/scientific-calculator/">EN</a><a href="/es/scientific-calculator/" class="active">ES</a></div></nav></div></header>

    <main class="main-container">
        <section class="hero"><h1>Calculadora Científica</h1><p>Calculadora científica gratis con trigonometría, logaritmos y más.</p></section>
        <div class="calc-body">
            <div class="display" id="display">0</div>
            <div class="btn-grid">
                <button class="btn btn-clr" onclick="borrar()">AC</button>
                <button class="btn btn-func" onclick="agregar('(')">(</button>
                <button class="btn btn-func" onclick="agregar(')')">)</button>
                <button class="btn btn-func" onclick="agregar('Math.PI')">π</button>
                <button class="btn btn-func" onclick="agregar('**')">xʸ</button>
                <button class="btn btn-func" onclick="agregar('Math.sin(')">sin</button>
                <button class="btn btn-func" onclick="agregar('Math.cos(')">cos</button>
                <button class="btn btn-func" onclick="agregar('Math.tan(')">tan</button>
                <button class="btn btn-func" onclick="agregar('Math.sqrt(')">√</button>
                <button class="btn btn-func" onclick="agregar('Math.log10(')">log</button>
                <button class="btn btn-num" onclick="agregar('7')">7</button>
                <button class="btn btn-num" onclick="agregar('8')">8</button>
                <button class="btn btn-num" onclick="agregar('9')">9</button>
                <button class="btn btn-op" onclick="agregar('/')">÷</button>
                <button class="btn btn-func" onclick="agregar('Math.exp(')">eˣ</button>
                <button class="btn btn-num" onclick="agregar('4')">4</button>
                <button class="btn btn-num" onclick="agregar('5')">5</button>
                <button class="btn btn-num" onclick="agregar('6')">6</button>
                <button class="btn btn-op" onclick="agregar('*')">×</button>
                <button class="btn btn-func" onclick="agregar('Math.log(')">ln</button>
                <button class="btn btn-num" onclick="agregar('1')">1</button>
                <button class="btn btn-num" onclick="agregar('2')">2</button>
                <button class="btn btn-num" onclick="agregar('3')">3</button>
                <button class="btn btn-op" onclick="agregar('-')">−</button>
                <button class="btn btn-func" onclick="factorial()">n!</button>
                <button class="btn btn-num" onclick="agregar('0')">0</button>
                <button class="btn btn-num" onclick="agregar('.')">.</button>
                <button class="btn btn-eq" onclick="calcular()">=</button>
                <button class="btn btn-op" onclick="agregar('+')">+</button>
                <button class="btn btn-clr" onclick="retroceder()">⌫</button>
            </div>
        </div>
        <div class="ad-placeholder">Anuncio AdSense</div>

    <script>
        let d=document.getElementById('display');
        function agregar(v){if(d.textContent==='0'||d.textContent==='Error')d.textContent='';d.textContent+=v}
        function borrar(){d.textContent='0'}
        function retroceder(){d.textContent=d.textContent.slice(0,-1)||'0'}
        function factorial(){let n=parseFloat(d.textContent);if(n<0||!Number.isInteger(n)){d.textContent='Error';return}let r=1;for(let i=2;i<=n;i++)r*=i;d.textContent=r}
        function calcular(){try{let e=d.textContent.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let r=eval(e);d.textContent=Number.isFinite(r)?parseFloat(r.toPrecision(12)).toString():'Error'}catch(e){d.textContent='Error'}}
    </script>
