    <main class="main-container">
        <section class="hero"><h1>Generador de Contraseñas Seguras</h1><p>Genera contraseñas fuertes y aleatorias. Personaliza longitud y tipos de caracteres.</p></section>
        <section class="calculator-card">
            <div class="calculator-grid">
                <div class="input-column">
                    <div class="input-group"><label>Longitud: <span id="length-display">16</span></label><input type="range" id="password-length" value="16" min="8" max="64" oninput="document.getElementById('length-display').textContent=this.value;generar()"></div>
                    <div class="option-row"><input type="checkbox" id="include-upper" checked onchange="generar()"><label>Mayúsculas (A-Z)</label></div>
                    <div class="option-row"><input type="checkbox" id="include-lower" checked onchange="generar()"><label>Minúsculas (a-z)</label></div>
                    <div class="option-row"><input type="checkbox" id="include-numbers" checked onchange="generar()"><label>Números (0-9)</label></div>
                    <div class="option-row"><input type="checkbox" id="include-symbols" checked onchange="generar()"><label>Símbolos (!@#$%)</label></div>
                    <button class="generate-btn" onclick="generar()">Generar Nueva Contraseña</button>
                </div>
                <div>
                    <div class="password-display" id="password-display">Haz clic en Generar</div>
                    <button class="copy-btn" onclick="copiarPass()">📋 Copiar al Portapapeles</button>
                    <div class="strength-bar" id="strength-bar" style="width:100%;background:#22c55e"></div>
                    <div class="ad-placeholder">Anuncio AdSense</div>
                </div>
            </div>

    <script>
        function generar(){const l=parseInt(document.getElementById('password-length').value);const u=document.getElementById('include-upper').checked;const lo=document.getElementById('include-lower').checked;const n=document.getElementById('include-numbers').checked;const s=document.getElementById('include-symbols').checked;let c='';if(u)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(lo)c+='abcdefghijklmnopqrstuvwxyz';if(n)c+='0123456789';if(s)c+='!@#$%^&*()_+-=[]{}|;:,.<>?';if(!c){document.getElementById('password-display').textContent='Selecciona una opción';return}let p='';for(let i=0;i<l;i++)p+=c.charAt(Math.floor(Math.random()*c.length));document.getElementById('password-display').textContent=p;const b=document.getElementById('strength-bar');let st=0;if(l>=12)st+=30;else if(l>=8)st+=15;if(u)st+=20;if(lo)st+=20;if(n)st+=15;if(s)st+=15;b.style.width=st+'%';b.style.background=st>=70?'#22c55e':st>=40?'#f59e0b':'#ef4444'}
        function copiarPass(){navigator.clipboard.writeText(document.getElementById('password-display').textContent);const btn=document.querySelector('.copy-btn');btn.textContent='✅ ¡Copiado!';setTimeout(()=>btn.textContent='📋 Copiar al Portapapeles',2000)}
        generar();
    </script>
