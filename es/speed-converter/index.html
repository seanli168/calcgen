                <div class="input-group"><label>De</label><input type="number" id="from-value" value="60" step="any" oninput="convertir()"><select id="from-unit" onchange="convertir()"><option value="mph">MPH</option><option value="kph">KPH</option><option value="knots">Nudos</option><option value="ms">m/s</option></select></div>

    <script>
        const factores={mph:1,kph:1.60934,knots:0.868976,ms:2.23694},nombres={mph:'MPH',kph:'KPH',knots:'Nudos',ms:'m/s'};
        function convertir(){const v=parseFloat(document.getElementById('from-value').value)||0;const f=document.getElementById('from-unit').value,t=document.getElementById('to-unit').value;const mph=v/factores[f],r=mph*factores[t];document.getElementById('to-value').textContent=parseFloat(r.toPrecision(6))+' '+nombres[t]}
        function intercambiar(){const fs=document.getElementById('from-unit'),ts=document.getElementById('to-unit');const t=fs.value;fs.value=ts.value;ts.value=t;convertir()}
        document.getElementById('to-unit').value='kph';convertir();
