    <main class="main-container">
        <section class="hero"><h1>Calculadora de Edad</h1><p>Calcula tu edad exacta en años, meses y días. Introduce tu fecha de nacimiento.</p></section>
        <section class="calculator-card">
            <div class="calculator-grid">
                <div class="input-column">
                    <div class="input-group"><label>Fecha de Nacimiento</label><input type="date" id="birth-date" value="1990-01-01"></div>
                    <div class="input-group"><label>Calcular Hasta (Opcional)</label><input type="date" id="end-date"></div>
                    <button class="calculate-btn" onclick="calcularEdad()">Calcular Edad</button>
                </div>
                <div class="result-display">
                    <div class="big-age" id="age-years">—</div>
                    <div class="age-label">años</div>
                    <div class="result-details">
                        <div class="result-mini"><div class="mini-value" id="age-months">—</div><div class="mini-label">Meses</div></div>
                        <div class="result-mini"><div class="mini-value" id="age-days">—</div><div class="mini-label">Días</div></div>
                        <div class="result-mini"><div class="mini-value" id="age-total-days">—</div><div class="mini-label">Total Días</div></div>
                    </div>
                    <div class="ad-placeholder">Anuncio AdSense</div>
                </div>
            </div>
        </section>

    <footer class="footer"><div class="footer-links"><a href="/es/privacy-policy/">Privacidad</a><a href="/es/terms/">Términos</a><a href="/es/contact/">Contacto</a></div><p>&copy; 2026 CalcGen</p></footer>
    <script>
        document.getElementById('end-date').valueAsDate=new Date();
        function calcularEdad(){
            const b=new Date(document.getElementById('birth-date').value);
            const e=document.getElementById('end-date').value?new Date(document.getElementById('end-date').value):new Date();
            if(isNaN(b.getTime()))return;
            let y=e.getFullYear()-b.getFullYear(),m=e.getMonth()-b.getMonth(),d=e.getDate()-b.getDate();
            if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}
            if(m<0){y--;m+=12}
            const td=Math.floor((e-b)/86400000);
            document.getElementById('age-years').textContent=y;
            document.getElementById('age-months').textContent=m;
            document.getElementById('age-days').textContent=d;
            document.getElementById('age-total-days').textContent=td.toLocaleString();
        }
        calcularEdad();
    </script>
